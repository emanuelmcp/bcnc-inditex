spring:
  application:
    name: bcnc-inditex
  h2:
    console:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:h2:mem:bcnc-db}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: false
    open-in-view: false
  sql:
    init:
      mode: always
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false
info:
  app:
    name: bcnc-inditex
    description: REST service that resolves the applicable price rate for a product of a brand at a given date
api:
  prefix: /api/v1
