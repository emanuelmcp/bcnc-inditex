services:
  bcnc-inditex:
    build:
      context: .
      dockerfile: Dockerfile
    image: bcnc-inditex:0.0.1-SNAPSHOT
    container_name: bcnc-inditex
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped